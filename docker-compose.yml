services:
  backend:
    build:
      context: ./backend
    container_name: fincorp-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Points the React app at the backend running on the host.
        REACT_APP_API_URL: http://localhost:3001
    container_name: fincorp-ui
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
